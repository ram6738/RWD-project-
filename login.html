<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Buddy - Login</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
          body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.navbar {
    background-color: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    width: 90%;
    margin: 15px auto;
    border-radius: 20px;
    padding: 10px 20px;
}

.logo {
    width: 55px;
    height: 55px;
    object-fit: contain;
}

.navbar a {
    color: black;
    margin: 0 8px;
}

.page-background {
    flex: 1;
    padding-top: 100px;

    display: flex;
    justify-content: center;
    align-items: center;

    background-image:
        linear-gradient(rgba(0, 0, 0, 0.3),
                        rgba(0, 0, 0, 0.4)),
        url("https://i.imgur.com/gc1HjiF.jpg");

    background-size: cover;
    background-position: center;
}

.login-card {
    width: 400px;
    padding: 35px;
    background-color: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
}

.login-card h2 {
    text-align: center;
    margin-bottom: 25px;
}

.login-icon {
    text-align: center;
    font-size: 45px;
    margin-bottom: 15px;
}

.form-control {
    border-radius: 8px;
}

.login-button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
}

.register-text {
    text-align: center;
    margin-top: 20px;
}

.footer1 {
    background-color: #222;
    color: white;
    text-align: center;
    padding: 10px;
    flex-shrink: 0;
}

.footer1 h4,
.footer1 p {
    margin: 5px;
}

    </style>
</head>

<body>


    <nav class="navbar fixed-top navbar-expand-md navbar-light">

        <a class="navbar-brand" href="Home_page.html">

            <img src="https://files.catbox.moe/k0q1m6.png"
                class="logo"
                alt="Travel Buddy">

        </a>


        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a class="nav-link" href="Home_page.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="booking.html">
                        Booking
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <main class="page-background">


        <div class="login-card">


            <div class="login-icon">

                <i class="fas fa-user-circle"></i>

            </div>


            <h2>Login</h2>


            <form id="loginForm">


                <div class="form-group">

                    <label>Email Address</label>

                    <input type="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input type="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required>

                </div>


                <div class="form-check mb-3">

                    <input type="checkbox"
                           class="form-check-input"
                           id="remember">

                    <label class="form-check-label"
                           for="remember">

                        Remember me

                    </label>

                </div>


                <button type="submit"
                        class="btn btn-primary login-button">

                    <i class="fas fa-sign-in-alt"></i>
                    Login

                </button>


            </form>


            <div class="register-text">

                <p>
                    Don't have an account?
                    <a href="registration.html">Register here</a>
                </p>

            </div>


        </div>


    </main>


    <footer class="footer1">

        <h4>Travel Buddy</h4>

        <p>Explore. Travel. Enjoy.</p>

        <p>© 2026 Travel Buddy</p>

    </footer>


    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/js/bootstrap.min.js"></script>


    <script>

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Login successful!");

        });

    </script>


</body>

</html>
