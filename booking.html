<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Buddy - Booking</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .navbar {
            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            width: 90%;
            margin: 15px auto;
            border-radius: 20px;
            padding: 10px 20px;
        }

        .logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .navbar a {
            color: black;
            margin: 0 8px;
        }

        .booking-background {
            min-height: 100vh;
            padding: 120px 20px 50px;

            background-image:
                linear-gradient(rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.45)),
                url("https://i.imgur.com/gc1HjiF.jpg");

            background-size: cover;
            background-position: center;
        }

        .booking-container {
            width: 85%;
            max-width: 1100px;
            margin: auto;
            background-color: rgba(255, 255, 255, 0.93);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
        }

        .booking-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .booking-title h1 {
            font-size: 38px;
        }

        .booking-title p {
            color: #666;
        }

        .form-control {
            border-radius: 8px;
        }


        .footer1 {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .footer1 h4,
        .footer1 p {
            margin: 5px;
        }
    </style>
</head>

<body>


    <nav class="navbar fixed-top navbar-expand-md navbar-light">

        <a class="navbar-brand" href="Home_page.html">

            <img src='https://files.catbox.moe/k0q1m6.png'
                class="logo" alt="Travel Buddy">

        </a>


        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ml-auto">

                <li class="nav-item">
                    <a class="nav-link" href="Home_page.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="booking.html">
                        Booking
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <section class="booking-background">

        <div class="booking-container">


            <div class="booking-title">

                <h1>Book Your Trip</h1>

                <p>
                    Plan your journey with Travel Buddy
                </p>

            </div>


            <form id="bookingForm">


                <h4 class="section-title">
                    <i class="fas fa-user"></i>
                    Personal Information
                </h4>


                <div class="form-row">

                    <div class="form-group col-md-6">

                        <label>Full Name</label>

                        <input type="text" class="form-control" placeholder="Enter your full name" required>

                    </div>


                    <div class="form-group col-md-6">

                        <label>Email Address</label>

                        <input type="email" class="form-control" placeholder="Enter your email" required>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group col-md-6">

                        <label>Phone Number</label>

                        <input type="tel" class="form-control" placeholder="Enter your phone number" required>

                    </div>


                    <div class="form-group col-md-6">

                        <label>Number of Travelers</label>

                        <input type="number" class="form-control" min="1" max="20" placeholder="Number of travelers"
                            required>

                    </div>

                </div>


                <h4 class="section-title">
                    <i class="fas fa-map-marker-alt"></i>
                    Trip Details
                </h4>


                <div class="form-row">


                    <div class="form-group col-md-6">

                        <label>Destination</label>

                        <select class="form-control" required>

                            <option value="">
                                Select Destination
                            </option>

                            <option>Paris</option>

                            <option>Maldives</option>

                            <option>Tokyo</option>

                            <option>Dubai</option>

                            <option>Switzerland</option>

                            <option>Bali</option>

                            <option>London</option>

                        </select>

                    </div>


                    <div class="form-group col-md-6">

                        <label>Travel Type</label>

                        <select class="form-control" required>

                            <option value="">
                                Select Travel Type
                            </option>

                            <option>Solo Trip</option>

                            <option>Couple</option>

                            <option>Family Vacation</option>

                            <option>Friends Trip</option>

                            <option>Business Trip</option>

                        </select>

                    </div>


                </div>


                <div class="form-row">


                    <div class="form-group col-md-4">

                        <label>Departure Date</label>

                        <input type="date" class="form-control" required>

                    </div>


                    <div class="form-group col-md-4">

                        <label>Return Date</label>

                        <input type="date" class="form-control" required>

                    </div>


                    <div class="form-group col-md-4">

                        <label>Duration</label>

                        <select class="form-control">

                            <option>2 Days</option>

                            <option>3 Days</option>

                            <option>5 Days</option>

                            <option>7 Days</option>

                            <option>10 Days</option>

                            <option>14 Days</option>

                        </select>

                    </div>


                </div>


                <div class="form-row">


                    <div class="form-group col-md-6">

                        <label>Accommodation</label>

                        <select class="form-control">

                            <option>3 Star Hotel</option>

                            <option>4 Star Hotel</option>

                            <option>5 Star Hotel</option>

                            <option>Resort</option>

                            <option>Budget Hotel</option>

                        </select>

                    </div>


                    <div class="form-group col-md-6">

                        <label>Transportation</label>

                        <select class="form-control">

                            <option>Flight</option>

                            <option>Train</option>

                            <option>Bus</option>

                            <option>Private Car</option>

                        </select>

                    </div>


                </div>


                <div class="form-group">

                    <label>Pickup Location</label>

                    <input type="text" class="form-control" placeholder="Enter pickup location">

                </div>


                <div class="form-group">

                    <label>Special Requests</label>

                    <textarea class="form-control" rows="3" placeholder="Enter any special requests"></textarea>

                </div>


                <div class="form-group">

                    <label>Payment Method</label>

                    <select class="form-control">

                        <option>Credit / Debit Card</option>

                        <option>UPI</option>

                        <option>Net Banking</option>

                        <option>Pay at Office</option>

                    </select>

                </div>


                <div class="form-check mb-4">

                    <input type="checkbox" class="form-check-input" id="terms" required>

                    <label class="form-check-label" for="terms">

                        I confirm that the information provided is correct.

                    </label>

                </div>


                <button type="submit" class="btn btn-primary btn-block">

                    <i class="fas fa-plane"></i>
                    Confirm Booking

                </button>


            </form>

        </div>

    </section>


    <footer class="footer1">

        <h4>Travel Buddy</h4>

        <p>Explore. Travel. Enjoy.</p>

        <p>© 2026 Travel Buddy</p>

    </footer>



    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/js/bootstrap.min.js"></script>


    <script>

        document.getElementById("bookingForm").addEventListener("submit", function (event) {

            event.preventDefault();

            alert("Your booking has been submitted successfully!");

        });

    </script>


</body>

</html>
